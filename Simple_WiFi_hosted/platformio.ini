; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-p4_r3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-p4-evboard
framework = espidf
lib_ldf_mode = deep
board_build.partitions = partitionP4.csv ;huge_app.csv
board_build.arduino.memory_type = qio_qspi
board_build.psram = true


build_flags = 
	-D CORE_DEBUG_LEVEL=5
	-D ESP_PLATFORM
	-std=gnu++17
	-D LV_CONF_INCLUDE_SIMPLE
	-D LVGL_INCLUDE_SIMPLE
	-Isrc
	
	-D LV_USE_PERF_MONITOR=1 ;Show CPU usage and FPS count   * Requires `LV_USE_SYSMON = 1`*/  look at lv_conf.h
	-D LV_USE_LOG=1
	-D LV_TICK_CUSTOM=1

	-D CONFIG_EXAMPLE_LVGL_PORT_BUF_HEIGHT=40  ; does no matter
	-D CONFIG_EXAMPLE_LVGL_PORT_BUF_PSRAM=1	; Allocate LVGL buffer in PSRAM (external SPI flash memory chip)
	-D CONFIG_USE_TASK_NOTIFICATIONS=1

	
	-D CONFIG_SPI_FLASH_SUPPORT_BOYA_CHIP=1


monitor_speed = 115200



